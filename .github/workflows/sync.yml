name: sync

on:
  schedule:
    # 6時間毎。1回300分の予算を使い切って終わるので（実測 300.1min / 243本）、
    # 回数がそのままスループットになる。publicリポなのでActionsの分課金は無い。
    # 並列は4のまま＝YouTubeへの瞬間的な負荷は1日1回のときと変わらない。
    - cron: "0 2,8,14,20 * * *"
  workflow_dispatch:
    inputs:
      window_days:
        description: "window in days"
        default: "30"
      mode:
        description: "normal=未集計の配信を消化 / gift=窓内のギフト有り配信を再処理 / member=会員データ欠損行を再処理"
        default: "normal"
        type: choice
        options:
          - normal
          - gift
          - member

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SYNC_WINDOW_DAYS: ${{ github.event.inputs.window_days || '30' }}
          GIFT_BACKFILL: ${{ github.event.inputs.mode == 'gift' && '1' || '0' }}
          MEMBER_BACKFILL: ${{ github.event.inputs.mode == 'member' && '1' || '0' }}
