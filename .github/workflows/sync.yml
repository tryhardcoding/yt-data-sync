name: sync

on:
  schedule:
    # 6時間毎。1回300分の予算を使い切って終わるので（実測 300.1min / 243本）、
    # 回数がそのままスループットになる。publicリポなのでActionsの分課金は無い。
    # 並列は4のまま＝YouTubeへの瞬間的な負荷は1日1回のときと変わらない。
    - cron: "0 2,8,14,20 * * *"
  workflow_dispatch:
    inputs:
      window_days:
        description: "window in days"
        default: "30"
      mode:
        description: "normal=未集計の配信を消化 / gift=窓内のギフト有り配信を再処理 / member=会員データ欠損行を再処理"
        default: "normal"
        type: choice
        options:
          - normal
          - gift
          - member
      budget_min:
        description: "実行予算(分)。短く回して stats だけ見たいときに下げる"
        default: "300"
      chat_retries:
        description: "チャットページのリトライ回数。絞られているか切り分けるときに下げる"
        default: "8"

concurrency:
  # 手動実行は定期実行と別枠にする。定期実行が5時間走っている最中でも、
  # 短い診断用の実行を割り込ませて stats を見られるようにするため。
  group: sync-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # 発言者の識別子をハッシュにするpepper。無ければ発言者の観測だけが止まる。
          # **値を変えないこと**（変えると同じ視聴者が別人として数えられる）。
          COMMENTER_PEPPER: ${{ secrets.COMMENTER_PEPPER }}
          SYNC_WINDOW_DAYS: ${{ github.event.inputs.window_days || '30' }}
          GIFT_BACKFILL: ${{ github.event.inputs.mode == 'gift' && '1' || '0' }}
          MEMBER_BACKFILL: ${{ github.event.inputs.mode == 'member' && '1' || '0' }}
          SYNC_BUDGET_MIN: ${{ github.event.inputs.budget_min || '300' }}
          SYNC_CHAT_RETRIES: ${{ github.event.inputs.chat_retries || '8' }}
